apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backstage-postgres
  namespace: backstage
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: backstage-postgres
    creationPolicy: Owner
  data:
    - secretKey: POSTGRES_HOST
      remoteRef:
        key: backstage/postgres
        property: host
    - secretKey: POSTGRES_PORT
      remoteRef:
        key: backstage/postgres
        property: port
    - secretKey: POSTGRES_USER
      remoteRef:
        key: backstage/postgres
        property: user
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: backstage/postgres
        property: password
