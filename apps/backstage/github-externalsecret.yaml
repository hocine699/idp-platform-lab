apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backstage-github
  namespace: backstage
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: backstage-github
  data:
    - secretKey: GITHUB_TOKEN
      remoteRef: { key: backstage/github, property: token }
