apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: backstage-egress
  namespace: backstage
spec:
  endpointSelector:
    matchLabels:
      app: backstage
  egress:
    # 1. La base de données sur le NAS
    - toCIDR:
        - 192.168.1.253/32
      toPorts:
        - ports:
            - port: "5433"
              protocol: TCP
    # 2. Le DNS du cluster
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
    # 3. NOUVEAU : GitHub, pour lire les cartes d'identité
    - toFQDNs:
        - matchName: github.com
        - matchName: api.github.com
        - matchName: raw.githubusercontent.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
