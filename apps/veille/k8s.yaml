# Appli "Veille" : le tableau de bord Glance, derrière le Gateway.
# Sa configuration (glance.yml) est chargée à part, dans la ConfigMap glance-config.
apiVersion: v1
kind: Namespace
metadata:
  name: veille

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: glance
  namespace: veille
spec:
  replicas: 1
  selector:
    matchLabels:
      app: glance
  template:
    metadata:
      labels:
        app: glance
    spec:
      containers:
        - name: glance
          image: glanceapp/glance:v0.8.5
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: config
              mountPath: /app/config
          resources:
            requests:
              memory: 32Mi
            limits:
              memory: 128Mi
      volumes:
        - name: config
          configMap:
            name: glance-config

---
apiVersion: v1
kind: Service
metadata:
  name: glance
  namespace: veille
spec:
  selector:
    app: glance
  ports:
    - name: http
      port: 80
      targetPort: http

---
# veille.devops-hme.cloud -> Glance (derrière Cloudflare Access).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: glance
  namespace: veille
spec:
  parentRefs:
    - name: main
      namespace: gateway
  hostnames:
    - veille.devops-hme.cloud
  rules:
    - backendRefs:
        - name: glance
          port: 80
