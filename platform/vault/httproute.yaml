# vault.devops-hme.cloud -> interface web de Vault (derrière Cloudflare Access).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vault
  namespace: vault
spec:
  parentRefs:
    - name: main
      namespace: gateway
  hostnames:
    - vault.devops-hme.cloud
  rules:
    - backendRefs:
        - name: vault
          port: 8200
