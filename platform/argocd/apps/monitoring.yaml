apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 91.8.1
      helm:
        releaseName: monitoring
        valueFiles:
          - $values/platform/monitoring/values.yaml
    - repoURL: https://github.com/hocine699/idp-platform-lab.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  # Pas encore de synchro automatique : on relit d'abord le diff.
