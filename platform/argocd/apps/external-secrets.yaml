apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd                 # où la fiche est rangée
spec:
  project: default
  source:                           # une seule source : pas de values à lire
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: 2.10.0          # sans « v », comme dans helm list
    helm:
      releaseName: external-secrets # même nom que l'existant : adoption sans rien recréer
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets     # où ESO est livré
  # Pas encore de syncPolicy : on relit d'abord le diff.
