apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: buildkit
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/hocine699/idp-platform-lab.git
    targetRevision: main
    path: platform/buildkit
  destination:
    server: https://kubernetes.default.svc
    namespace: buildkit
  syncPolicy:
    automated:
      prune: true      # aucune donnée à protéger : le cache est jetable
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
