apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd                # où la FICHE est rangée
spec:
  project: default
  sources:
    - repoURL: https://charts.jetstack.io
      chart: cert-manager
      targetRevision: v1.19.1
      helm:
        releaseName: cert-manager
        valueFiles:
          - $values/platform/cert-manager/values.yaml
    - repoURL: https://github.com/hocine699/idp-platform-lab.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager        # CHANGEMENT 1 : où cert-manager est LIVRÉ
  # CHANGEMENT 2 (temporaire) : pas de syncPolicy pour l'instant.
  # ArgoCD calcule le diff mais n'applique rien tant qu'on ne clique pas sur Sync.
  # Une fois le diff relu, on remettra :
  #   syncPolicy:
  #     automated:
  #       prune: false
  #       selfHeal: true
