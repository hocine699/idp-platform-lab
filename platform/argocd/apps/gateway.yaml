apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway
  namespace: argocd
  # Pas de finalizer : supprimer l'Application ne supprime pas les ressources.
spec:
  project: default
  source:
    repoURL: https://github.com/hocine699/idp-platform-lab.git
    targetRevision: main
    path: platform/gateway
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: false     # brique critique : jamais de suppression automatique
      selfHeal: true   # mais toute modif à la main est annulée
