# argocd.devops-hme.cloud -> interface d'Argo CD (derrière Cloudflare Access).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd
  namespace: argocd
spec:
  parentRefs:
    - name: main
      namespace: gateway
  hostnames:
    - argocd.devops-hme.cloud
  rules:
    - backendRefs:
        - name: argocd-server
          port: 80
