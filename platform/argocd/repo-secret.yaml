# Accès d'Argo CD au dépôt privé idp-platform-lab.
# Token GitHub en lecture seule, lu dans Vault (secret/github/argocd).
# Le label "secret-type: repository" dit à Argo CD : « ceci est un dépôt ».
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: repo-idp-platform-lab
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: repo-idp-platform-lab
    creationPolicy: Owner
    template:
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repository
      data:
        type: git
        url: https://github.com/hocine699/idp-platform-lab.git
        username: "{{ .username }}"
        password: "{{ .token }}"
  data:
    - secretKey: username
      remoteRef:
        key: github/argocd
        property: username
    - secretKey: token
      remoteRef:
        key: github/argocd
        property: token
