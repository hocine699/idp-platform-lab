apiVersion: v1
kind: Namespace
metadata:
  name: gateway

---
# Porte d'entrée unique du cluster. Remplace ingress-nginx.
# Cilium lui donne une IP de la réserve "lan" et Envoy traite le trafic.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: main
  namespace: gateway
spec:
  gatewayClassName: cilium
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      # Les HTTPRoute de n'importe quel namespace peuvent s'y rattacher.
      allowedRoutes:
        namespaces:
          from: All
