apiVersion: v1
kind: Namespace
metadata:
  name: gateway

---
# Porte d'entrée unique du cluster. Remplace ingress-nginx.
# Cilium lui donne une IP de la réserve "lan" et Envoy traite le trafic.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: main
  namespace: gateway
spec:
  gatewayClassName: cilium
  listeners:
    # HTTP : utilisé par le tunnel Cloudflare (le HTTPS est fait chez Cloudflare).
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All

    # HTTPS : utilisé depuis la maison (nœuds -> Harbor, via AdGuard).
    # Certificat Let's Encrypt *.devops-hme.cloud géré par cert-manager.
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.devops-hme.cloud"
      tls:
        mode: Terminate
        certificateRefs:
          - name: wildcard-devops-hme-cloud-tls
      allowedRoutes:
        namespaces:
          from: All
