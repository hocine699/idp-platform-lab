# kargo.devops-hme.cloud -> interface de Kargo (derrière Cloudflare Access).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kargo
  namespace: kargo
spec:
  parentRefs:
    - name: main
      namespace: gateway
  hostnames:
    - kargo.devops-hme.cloud
  rules:
    - backendRefs:
        - name: kargo-api
          port: 80
