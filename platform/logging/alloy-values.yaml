# Réglages Helm d'Alloy (chart grafana/alloy).
# Tournée 1 : logs des pods -> Loki.
# Tournée 2 : OpenTelemetry (traces) -> Tempo.
controller:
  type: deployment
  replicas: 1

alloy:
  resources:
    requests:
      memory: 64Mi
    limits:
      memory: 256Mi
  # Les portes d'entrée OpenTelemetry du facteur.
  extraPorts:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
      protocol: TCP
    - name: otlp-http
      port: 4318
      targetPort: 4318
      protocol: TCP
  configMap:
    content: |-
      // ===== Tournée 1 : les logs =====
      // 1. Trouver tous les pods du cluster.
      discovery.kubernetes "pods" {
        role = "pod"
      }

      // 2. Leur donner des étiquettes lisibles dans Grafana.
      discovery.relabel "pods" {
        targets = discovery.kubernetes.pods.targets

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_node_name"]
          target_label  = "node"
        }
      }

      // 3. Lire les logs de ces pods.
      loki.source.kubernetes "pods" {
        targets    = discovery.relabel.pods.output
        forward_to = [loki.write.default.receiver]
      }

      // 4. Les envoyer à Loki.
      loki.write "default" {
        endpoint {
          url = "http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push"
        }
      }

      // ===== Tournée 2 : OpenTelemetry =====
      // 5. Recevoir les colis OpenTelemetry (ports 4317 et 4318).
      otelcol.receiver.otlp "default" {
        grpc {
          endpoint = "0.0.0.0:4317"
        }
        http {
          endpoint = "0.0.0.0:4318"
        }
        output {
          traces = [otelcol.processor.batch.default.input]
        }
      }

      // 6. Les regrouper par paquets (moins d'allers-retours).
      otelcol.processor.batch "default" {
        output {
          traces = [otelcol.exporter.otlp.tempo.input]
        }
      }

      // 7. Livrer les traces à Tempo.
      otelcol.exporter.otlp "tempo" {
        client {
          endpoint = "tempo.monitoring.svc.cluster.local:4317"
          tls {
            insecure = true
          }
        }
      }
