# registry.devops-hme.cloud -> Harbor.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: harbor
  namespace: harbor
spec:
  parentRefs:
    - name: main
      namespace: gateway
  hostnames:
    - registry.devops-hme.cloud
  rules:
    - filters:
        # Le client est toujours en HTTPS (Cloudflare ou guichet 443 du Gateway).
        # On le dit à Harbor, sinon il fabrique des liens en http://
        # (c'était la panne du "docker push" sur l'ancien cluster).
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: X-Forwarded-Proto
                value: https
      backendRefs:
        - name: harbor
          port: 80
