apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-robot-signal
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: harbor-robot-signal
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {"auths":{"registry.devops-hme.cloud":{"auth":"{{ printf "%s:%s" .username .password | b64enc }}"}}}
  data:
    - secretKey: username
      remoteRef: { key: harbor/robot-signal, property: username }
    - secretKey: password
      remoteRef: { key: harbor/robot-signal, property: password }
