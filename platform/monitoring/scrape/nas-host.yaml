# Collecte des métriques matérielles du NAS Synology (node-exporter en conteneur).
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: nas-host
  namespace: monitoring
  labels:
    release: monitoring
spec:
  staticConfigs:
    - targets:
        - "192.168.1.253:9100"
      labels:
        node: ds224
        role: stockage
