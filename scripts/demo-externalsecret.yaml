apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: demo-config
  namespace: default
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: demo-config
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: demo/config
        property: username
    - secretKey: password
      remoteRef:
        key: demo/config
        property: password
